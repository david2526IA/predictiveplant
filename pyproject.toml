[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictiveplant"
version = "0.1.0"
description = "Explainable anomaly detection for industrial telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Falcon"}]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
predictiveplant = "predictiveplant.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
